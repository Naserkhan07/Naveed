<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Autopilot — Status Panel</title>
<style>
:root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e;
  --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; --purple:#bc8cff; --cyan:#39c5cf; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 20px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 2; }
.brand { font-size: 18px; font-weight: 700; }
.pill { padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.pill.on { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid var(--green); }
.pill.off { background: rgba(248,81,73,.12); color: var(--red); border: 1px solid var(--red); }
.meta { color: var(--dim); font-size: 13px; }
.spacer { flex: 1; }
main { padding: 20px; max-width: 1400px; margin: 0 auto; display: grid; gap: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card, .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.card h2 { font-size: 16px; display: inline-block; }
.card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); }
.badge.on { color: var(--green); border-color: var(--green); }
.badge.paused { color: var(--amber); border-color: var(--amber); }
.big { font-size: 26px; font-weight: 700; }
.big small { font-size: 13px; color: var(--dim); font-weight: 400; }
.kv { list-style: none; margin-top: 10px; display: grid; gap: 4px; font-size: 13px; }
.kv b { color: var(--text); }
.kv .k { color: var(--dim); display: inline-block; min-width: 118px; }
.slots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.slot { font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--dim); }
.slot.done { border-color: var(--green); color: var(--green); }
.slot.partial { border-color: var(--amber); color: var(--amber); }
.slot.due { border-color: var(--red); color: var(--red); }
.two-col { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 1000px) { .two-col { grid-template-columns: 1fr 1fr; } }
.panel h2 { font-size: 15px; margin-bottom: 10px; }
.ready-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ready-meter { height: 12px; border-radius: 999px; overflow: hidden; background: #21262d; margin: 10px 0 8px; }
.ready-fill { height: 100%; width: 0; background: var(--blue); transition: width .25s ease; }
.ready-copy { color: var(--dim); font-size: 13px; }
.feed { list-style: none; max-height: 480px; overflow-y: auto; display: grid; gap: 6px; }
.feed li { display: flex; gap: 8px; align-items: baseline; border-bottom: 1px solid #21262d; padding-bottom: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); align-self: center; }
.k-publish .dot { background: var(--green); } .k-error .dot { background: var(--red); }
.k-limit .dot { background: var(--amber); } .k-delivery .dot { background: var(--blue); }
.k-queue .dot { background: var(--purple); } .k-channel .dot { background: var(--cyan); }
.msg { flex: 1; word-break: break-word; }
time { color: var(--dim); font-size: 12px; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { color: var(--dim); text-align: left; font-weight: 600; padding: 4px 8px 4px 0; }
td { border-top: 1px solid #21262d; padding: 6px 8px 6px 0; vertical-align: top; }
.cell-ok { color: var(--green); } .cell-wait { color: var(--amber); } .cell-off { color: var(--border); }
a { color: var(--blue); text-decoration: none; }
.err { color: var(--red); font-size: 12px; }
footer { color: var(--dim); font-size: 12px; padding-bottom: 24px; }
.empty { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<header>
  <span class="brand">Shorts Autopilot</span>
  <span id="bot-pill" class="pill off">connecting…</span>
  <span id="meta" class="meta"></span>
  <span class="spacer"></span>
  <span id="clock" class="meta"></span>
</header>
<main>
  <section class="panel" aria-live="polite">
    <div class="ready-head"><h2>Ready before the next slot</h2><span id="ready-badge" class="badge">preparing…</span></div>
    <div class="ready-meter" role="progressbar" aria-label="Finished clip buffer" aria-valuemin="0" aria-valuemax="99" aria-valuenow="0"><div id="ready-fill" class="ready-fill"></div></div>
    <p id="ready-copy" class="ready-copy">Waiting for buffer data…</p>
  </section>
  <section id="platforms" class="grid"></section>
  <section class="two-col">
    <div class="panel"><h2>Activity — what, when, where</h2><ul id="feed" class="feed"></ul></div>
    <div class="panel"><h2>Publication queue</h2><div id="queue"></div></div>
  </section>
  <footer id="config"></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ago(ts) {
  if (!ts) return "never";
  const when = new Date(ts).getTime();
  if (isNaN(when)) return "never";
  const s = Math.max(0, (Date.now() - when) / 1000);
  if (s < 8) return "just now";
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
const KIND_LABEL = {publish:"published", error:"error", limit:"limit", delivery:"delivery",
  queue:"queued", channel:"discovery", system:"system", info:"info"};

function renderPlatforms(list) {
  $("platforms").innerHTML = list.map((p) => {
    const today = p.scheduled ? `${p.uploads_today}<small> / ${p.owed_now} owed now</small>`
      : `${p.uploads_today}<small> today (no schedule)</small>`;
    const chips = (p.slots || []).map((s) =>
      `<span class="slot ${s.state}" title="${s.state}: ${s.done}/${s.cap} done">` +
      `${s.time} ${s.done}/${s.cap}</span>`).join("");
    const stateBadge = !p.enabled ? '<span class="badge">disabled</span>'
      : !p.scheduled ? '<span class="badge paused">publishes at intake</span>'
      : '<span class="badge on">scheduled</span>';
    const due = p.scheduled ? `<li><span class="k">credits due</span><b>${p.credits_due}</b></li>` : "";
    const next = p.scheduled ? `<li><span class="k">next slot</span>${esc(p.next_slot)}</li>` : "";
    return `<div class="card">
      <div class="head"><h2>${esc(p.name)}</h2>${stateBadge}</div>
      <div class="big">${today}</div>
      <div class="slots">${chips}</div>
      <ul class="kv">
        ${due}
        <li><span class="k">queue waiting</span><b>${p.queue_pending}</b></li>
        <li><span class="k">total published</span>${p.total_done}</li>
        <li><span class="k">last upload</span>${esc(ago(p.last_upload_at))}</li>
        ${next}
        ${p.scheduled ? `<li><span class="k">pace</span>${p.uploads_per_slot} per slot × ${p.slots_today_count} slot(s) today</li>` : ""}
      </ul>
    </div>`;
  }).join("");
}

function renderReadiness(config) {
  const ready = Math.max(0, Number(config.ready_clip_count || 0));
  const target = Math.max(1, Number(config.ready_buffer_target || 99));
  const occupancy = Math.max(ready, Number(config.ready_buffer_occupancy || 0));
  const staging = Math.max(0, occupancy - ready);
  const full = ready >= target;
  const badge = $("ready-badge");
  badge.className = "badge " + (full ? "on" : "paused");
  badge.textContent = full ? "buffer ready" : "buffering";
  const fill = $("ready-fill");
  fill.style.width = `${Math.min(100, ready / target * 100)}%`;
  const meter = fill.parentElement;
  meter.setAttribute("aria-valuemax", String(target));
  meter.setAttribute("aria-valuenow", String(Math.min(ready, target)));
  $("ready-copy").textContent =
    `${ready}/${target} finished clips ready for all enabled platforms · ` +
    `${staging} additional clip(s) in preparation · authorized channel uploads from the last ` +
    `${config.fallback_lookback_days} days; previously processed sources are skipped.`;
}

function renderFeed(events) {
  $("feed").innerHTML = events.length ? events.map((e) =>
    `<li class="k-${esc(e.kind)}"><span class="dot" title="${esc(KIND_LABEL[e.kind] || e.kind)}"></span>` +
    `<span class="msg">${esc(e.message)}</span><time>${esc(ago(e.ts))}</time></li>`).join("")
    : '<li class="empty">Nothing yet — discoveries, HotClip deliveries, and publishes show up here the moment they happen.</li>';
}

function renderQueue(rows) {
  if (!rows.length) { $("queue").innerHTML = '<p class="empty">Queue is empty. New HotClip exports appear here first.</p>'; return; }
  const names = rows[0] ? Object.keys(rows[0].platforms) : [];
  const head = names.map((n) => `<th>${esc(n.split(" ")[0])}</th>`).join("");
  const body = rows.map((r) => {
    const cells = names.map((n) => {
      const c = r.platforms[n];
      if (!c.enabled) return '<td class="cell-off">—</td>';
      if (c.done) {
        const link = c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noreferrer">✓</a>` : "✓";
        return `<td class="cell-ok" title="uploaded ${esc(ago(c.at))}">${link} <time>${esc(ago(c.at))}</time></td>`;
      }
      return '<td class="cell-wait">… pending</td>';
    }).join("");
    const err = r.error ? `<div class="err">⚠ ${esc(r.error)}</div>` : "";
    return `<tr><td><div>${esc(r.title)}</div>${err}<time>queued ${esc(ago(r.queued_at))}</time></td>${cells}</tr>`;
  }).join("");
  $("queue").innerHTML = `<table><thead><tr><th>clip</th>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function render(data) {
  const w = data.watcher;
  const pill = $("bot-pill");
  pill.className = "pill " + (w.running ? "on" : "off");
  pill.textContent = w.running ? "● RUNNING" : "● STALE — watcher not ticking";
  $("meta").textContent = `last tick ${ago(w.heartbeat_at)} · started ${ago(w.started_at)}` +
    ` · data from ${ago(data.generated_at)} · tz ${data.timezone}`;
  $("clock").textContent = `local ${data.local_time} ${data.timezone}`;
  renderReadiness(data.config);
  renderPlatforms(data.platforms);
  renderFeed(data.events);
  renderQueue(data.queue);
  const c = data.config;
  $("config").textContent =
    `HotClip watch: ${c.hotclip_watch_dir} · exports: ${c.hotclip_export_dir} · ` +
    `hashtags: ${c.hashtags_enabled ? c.hashtag_count + " tags from " + c.hashtag_file : "off"} · ` +
    `channels: ${c.channels} · links pending: ${c.links_pending} · ` +
    `channel scan every ${c.scan_interval_minutes}m · auto-refresh 5s`;
}

async function fetchStatus() {
  for (const url of ["api/status.json", "/api/status"]) {
    try {
      const r = await fetch(url, {cache: "no-store"});
      if (r.ok) return await r.json();
    } catch (e) { /* try next endpoint */ }
  }
  throw new Error("no status endpoint");
}
async function tick() {
  try {
    render(await fetchStatus());
  } catch (e) {
    const pill = $("bot-pill");
    pill.className = "pill off";
    pill.textContent = "● status endpoint unreachable";
  }
}
setInterval(tick, 5000);
tick();
</script>
</body>
</html>
