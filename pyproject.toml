[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naveed"
version = "0.3.0"
description = "A floating desktop AI companion that watches your screen and does the task on it, with an optional browser front end"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["desktop-agent", "computer-use", "screen-watching", "assistant", "overlay", "accessibility", "local-web-ui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]
# Naveed has NO mandatory dependencies: the mascot, the CLI, the watcher and the
# agent all import cleanly on a bare interpreter, and every heavy import is made
# at first use (see naveed/lazy.py). Each extra below unlocks one capability.
dependencies = []

[project.optional-dependencies]
# --- the visible companion -------------------------------------------------
# The ceiling is deliberate. PySide6 6.12.0 has a refcount regression that the
# mascot hits: the process dies with "Fatal Python error: none_dealloc:
# deallocating None" once a few thousand gradient fills have gone through a
# QPainter — which, at 45 fps, is a few seconds of animation. Bisected in this
# repo: the same loop aborts on 6.12.0 and survives indefinitely on 6.8.1.
# Raise it once upstream is fixed (see docs/TROUBLESHOOTING.md).
ui = ["PySide6-Essentials>=6.5,<6.12"]
# --- seeing the screen -----------------------------------------------------
capture = ["mss>=9.0", "Pillow>=10.0"]
# --- doing things to the screen --------------------------------------------
input = ["pynput>=1.7"]
# --- offline speech --------------------------------------------------------
voice = ["sounddevice>=0.4", "faster-whisper>=1.0", "piper-tts>=1.2", "numpy>=1.24"]
# --- reading text off the screen (optional) --------------------------------
ocr = ["pytesseract>=0.3.10"]
# --- the small LLM planner (only for the HTTP fast path) --------------------
llm = ["httpx>=0.26"]
# --- everything a normal desktop wants -------------------------------------
full = [
  "PySide6-Essentials>=6.5,<6.12",   # see the note on the `ui` extra
  "mss>=9.0",
  "Pillow>=10.0",
  "pynput>=1.7",
  "numpy>=1.24",
]
dev = ["pytest>=7.4", "pillow>=10.0"]

[project.scripts]
naveed = "naveed.__main__:main"
# the browser front end on its own: no PySide6, no window, standard library only
naveed-web = "naveed.server:main"

[project.urls]
Homepage = "https://github.com/Naserkhan07/Naveed"
Issues = "https://github.com/Naserkhan07/Naveed/issues"

[tool.setuptools]
# Every sub-package has to be listed: an installed copy that is missing
# naveed.skills has no Polarion pack and no learned routines, and the failure
# only shows up when someone runs --skills. `tests/test_launcher.py` asserts this
# list matches the directories on disk.
packages = [
  "naveed",
  "naveed.screen",
  "naveed.overlay",
  "naveed.agent",
  "naveed.control",
  "naveed.speech",
  "naveed.skills",
  "naveed.render",
]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
