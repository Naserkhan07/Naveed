# Non-secret environment for the Cloud Run service (passed via --env-vars-file).
# Edit these like .env, then re-run cloudrun/deploy.sh. Secrets (tokens, cookies,
# the YouTube token JSON) are NOT here — they come from Secret Manager.
#
# Paths that point at secret files or the live-editable config (YOUTUBE_TOKEN_FILE,
# YTDLP_COOKIE_FILE, CHANNELS_FILE, CHANNEL_CONFIG_FILE, HASHTAGS_FILE, LINKS_FILE,
# STATUS_PANEL_HOST/PORT) are set at runtime by bootstrap.sh / entrypoint.sh and
# intentionally omitted here.

# --- rights + scheduling (same defaults as the GitHub Actions workflow) --------
RIGHTS_ACKNOWLEDGED: "true"
SCHEDULE_TIMEZONE: "Asia/Kolkata"

YOUTUBE_SCHEDULE_TIMES: "mon=07:30,13:00,20:30;tue=07:30,13:00,20:30;wed=07:30,13:00,20:30;thu=07:30,13:00,20:30;fri=07:30,21:30;sat=08:30,13:30,21:30;sun=08:30,13:30,21:30"
YOUTUBE_UPLOADS_PER_SLOT: "33"

INSTAGRAM_SCHEDULE_TIMES: "mon=08:00,20:30;tue=08:00,19:30;wed=12:00,20:30;thu=08:00,19:30;fri=12:00,20:30;sat=10:00,19:30;sun=10:30,19:30"
INSTAGRAM_UPLOADS_PER_SLOT: "10"

FACEBOOK_SCHEDULE_TIMES: "mon=09:00,20:00;tue=09:00,19:30;wed=12:00,20:00;thu=09:00,19:30;fri=12:00,20:30;sat=10:00,19:30;sun=10:30,19:00"
FACEBOOK_UPLOADS_PER_SLOT: "10"

# --- publishing flags (a platform with no credential is auto-disabled at boot) -
UPLOAD_YOUTUBE: "true"
UPLOAD_INSTAGRAM: "true"
UPLOAD_FACEBOOK: "true"
YOUTUBE_PRIVACY_STATUS: "public"

# --- discovery / volume --------------------------------------------------------
CHANNEL_SCAN_MAX_VIDEOS: "50"
CHANNEL_SCAN_INTERVAL_MINUTES: "30"
CHANNEL_FALLBACK_LOOKBACK_DAYS: "4"
CHANNEL_MAX_SOURCES_PER_SCAN: "5"
READY_CLIP_BUFFER_TARGET: "99"
FACEBOOK_LIMIT_COOLDOWN_HOURS: "24"
DELETE_UPLOADED_CLIPS: "false"
LINKS_POLL_SECONDS: "30"

# --- persistent state on the Cloud Storage volume -----------------------------
WORK_DIR: "/data/work"
DATABASE_PATH: "/data/work/jobs.db"
HOTCLIP_WATCH_DIR: "/data/hotclip-watch"
HOTCLIP_EXPORT_DIR: "/data/hotclip-exports"

# --- status dashboard (always-on, so a fresh heartbeat within ~120s = RUNNING) -
STATUS_PANEL_ENABLED: "true"
STATUS_STALE_AFTER_SECONDS: "180"
