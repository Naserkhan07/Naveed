name: Shorts bot — intake link

# Turns an issue opened with the "Queue a video link" form into a links.txt
# entry. Restricted to the repository owner so random visitors cannot feed
# the bot (the repo is public).

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'video-link')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and queue the link
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          if [ "$ISSUE_AUTHOR" != "$REPO_OWNER" ]; then
            echo "REJECT=owner-only" >> "$GITHUB_ENV"
            exit 0
          fi
          URL=$(printf '%s' "$ISSUE_BODY" \
            | grep -oE 'https?://(www\.)?(youtube\.com/(watch\?v=|shorts/)[A-Za-z0-9_-]+|youtu\.be/[A-Za-z0-9_-]+)' \
            | head -1 || true)
          if [ -z "${URL:-}" ]; then
            echo "REJECT=no-url" >> "$GITHUB_ENV"
            exit 0
          fi
          if grep -qFx "$URL" links.txt; then
            echo "REJECT=duplicate" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s\n' "$URL" >> links.txt
          echo "QUEUED_URL=$URL" >> "$GITHUB_ENV"

      - name: Commit the updated queue
        if: env.QUEUED_URL != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.txt
          git commit -m "bot: queue link from issue #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Comment and close the issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = { owner: context.repo.owner, repo: context.repo.repo,
                            issue_number: context.payload.issue.number };
            let body;
            if (process.env.REJECT === 'owner-only') {
              body = '⛔ Only the repository owner can queue video links.';
            } else if (process.env.REJECT === 'no-url') {
              body = '⚠️ No YouTube video URL found in this issue. Please open a new one with a valid link.';
            } else if (process.env.REJECT === 'duplicate') {
              body = 'ℹ️ This link is already in the queue.';
            } else {
              body = '✅ Queued! The bot will process this video on its next producer run.';
            }
            await github.rest.issues.createComment({ ...issue, body });
            await github.rest.issues.update({ ...issue, state: 'closed' });
