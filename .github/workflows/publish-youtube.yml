name: Shorts bot — publish YouTube

# Publishes the next rendered Short to YouTube at your scheduled times.
# KEEP THE CRON LINES AND THE "YOUTUBE_SCHEDULE_TIMES" REPOSITORY VARIABLE
# IN SYNC. Times below are UTC: 04:00 = 09:30 IST, 12:30 = 18:00 IST.

on:
  schedule:
    - cron: "0 4 * * *"   # 09:30 IST
    - cron: "30 12 * * *" # 18:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RIGHTS_ACKNOWLEDGED: "true"
      UPLOAD_YOUTUBE: "true"
      UPLOAD_INSTAGRAM: "true"
      UPLOAD_FACEBOOK: "true"
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      DATABASE_PATH: bot-state/jobs.db
      WORK_DIR: bot-work
      ARCHIVE_DIR: bot-work/pending_uploads
      DOWNLOADED_LINKS_LOG: bot-state/downloaded-links.log
      LINKS_FILE: links.txt
      CHANNELS_FILE: channels.txt
      KEEP_WORK_FILES: "true"
      DELETE_UPLOADED_CLIPS: "true"
      OPEN_UPLOAD_LIMIT_FOLDER: "false"
      SUBTITLES_ENABLED: ${{ vars.SUBTITLES_ENABLED || 'true' }}
      SCHEDULE_TIMEZONE: ${{ vars.SCHEDULE_TIMEZONE || 'Asia/Kolkata' }}
      YOUTUBE_SCHEDULE_TIMES: ${{ vars.YOUTUBE_SCHEDULE_TIMES }}
      INSTAGRAM_SCHEDULE_TIMES: ${{ vars.INSTAGRAM_SCHEDULE_TIMES }}
      FACEBOOK_SCHEDULE_TIMES: ${{ vars.FACEBOOK_SCHEDULE_TIMES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Restore OAuth/session files from secrets (never committed)
        run: |
          mkdir -p bot-state bot-work
          printf '%s' "${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}" > client_secret.json
          printf '%s' "${{ secrets.YOUTUBE_TOKEN_JSON }}" > youtube_token.json

      - name: Restore pending rendered clips from the producer run
        uses: actions/download-artifact@v4
        with:
          name: pending-clips
          path: bot-work/
        continue-on-error: true

      - name: Publish due YouTube uploads
        run: python -m shorts_bot.file_queue --publish youtube

      - name: Save remaining pending clips
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-clips
          overwrite: true
          if-no-files-found: ignore
          retention-days: 3
          path: bot-work/

      - name: Commit queue state back to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.txt channels.txt bot-state/jobs.db bot-state/downloaded-links.log
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          for attempt in 1 2 3; do
            if git commit -m "bot: update queue state (youtube publish)" \
              && git pull --rebase origin main \
              && git push origin HEAD:main; then
              exit 0
            fi
            sleep 15
          done
          echo "State push failed after retries; next run will reconcile." >&2
          exit 0
