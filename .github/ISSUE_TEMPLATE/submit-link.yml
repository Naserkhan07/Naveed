name: 📥 Queue a video link
description: Add one YouTube video to the bot's processing queue (repo owner only).
title: "Video link"
labels: ["video-link"]
body:
  - type: markdown
    attributes:
      value: |
        Paste one YouTube video URL below. The bot will pick it up on its next
        producer run, then this issue closes automatically.

        Only submit videos you own or have explicit permission/license to
        download, edit, and republish.
  - type: input
    id: url
    attributes:
      label: YouTube video URL
      placeholder: https://www.youtube.com/watch?v=...
      description: One video URL per issue (watch, youtu.be, or Shorts links all work).
    validations:
      required: true
